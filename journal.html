<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263d29">
  <meta name="description" content="Keep track of meals, movement and hobbies in a personal journal. See your entries one week at a time.">
  <title>Habit Journal — Health Factory</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./journal.css">
  <script type="module" src="./journal.js"></script>
</head>
<body class="journal-page">
<a class="skip" href="#main">Skip to content</a>
<header class="masthead shell">
  <a class="brand" href="./index.html"><span class="sprout" aria-hidden="true"></span>Health Factory</a>
  <nav aria-label="Main navigation">
    <a href="./nutrition.html">Nutrition</a>
    <a href="./relationships.html">Sex &amp; Relationships</a>
    <a href="./hobbies.html">Hobbies</a>
    <a href="./running.html">Running</a>
    <a href="./events.html">Events</a>
    <a class="nav-plan" href="./journal.html" aria-current="page">Journal <span aria-hidden="true">↗</span></a>
  </nav>
</header>
<main id="main" class="shell journal-main">
  <div class="journal-intro">
    <h1>Your habit <em>journal.</em></h1>
    <p>Choose a date and check off the meals and activities you want to remember. Your entries are saved in this browser.</p>
  </div>
  <div class="journal-layout">
    <section class="day-editor" aria-labelledby="day-title">
      <h2 id="day-title">My day</h2>
      <form id="day-form">
        <div class="day-fields">
          <label>Date <input type="date" name="date" required></label>
        </div>
        <fieldset>
          <legend>What was part of your day?</legend>
          <label class="habit"><input type="checkbox" name="habit" value="breakfast"><strong>Breakfast</strong></label>
          <label class="habit"><input type="checkbox" name="habit" value="lunch"><strong>Lunch</strong></label>
          <label class="habit"><input type="checkbox" name="habit" value="dinner"><strong>Dinner</strong></label>
          <label class="habit"><input type="checkbox" name="habit" value="snack"><strong>Snack</strong></label>
          <label class="habit"><input type="checkbox" name="habit" value="move"><strong>Movement</strong></label>
          <label class="habit"><input type="checkbox" name="habit" value="hobby"><strong>Hobby time</strong></label>
        </fieldset>
        <button id="delete-day" type="button" hidden>Delete this day’s entry</button>
        <p id="journal-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </form>
    </section>
    <section class="week-panel" aria-labelledby="week-title">
      <div class="week-header"><h2 id="week-title">My week</h2>
        <div class="week-nav"><button type="button" id="prev-week" aria-label="Previous week">←</button><button type="button" id="next-week" aria-label="Next week">→</button></div>
      </div>
      <p id="week-range"></p>
      <div id="week-days" aria-label="Days of the selected week" role="group"></div>
      <p id="week-caption"></p>
      <ul id="week-counts" aria-label="Habit totals for the week"></ul>
    </section>
  </div>
  <noscript><p>Turn on JavaScript in your browser to choose a date and save your entries.</p></noscript>
</main>
</body></html>
